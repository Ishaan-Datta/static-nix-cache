name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v${version}" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo version v${version}" >&2
            exit 1
          fi

      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package release binary
        shell: bash
        run: |
          set -euo pipefail
          asset="static-nix-cache-${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/static-nix-cache" "dist/${asset}"
          chmod +x "dist/${asset}"
          "dist/${asset}" --version

      - uses: actions/upload-artifact@v4
        with:
          name: static-nix-cache-${{ matrix.target }}
          path: dist/static-nix-cache-${{ matrix.target }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: static-nix-cache-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum static-nix-cache-* > SHA256SUMS

      - name: Create or resume draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft=$(gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq '.isDraft')
            if [ "$is_draft" != "true" ]; then
              echo "Release $GITHUB_REF_NAME is already published and immutable" >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --draft \
              --title "static-nix-cache $GITHUB_REF_NAME"
          fi

      - name: Upload and publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            dist/static-nix-cache-* \
            dist/SHA256SUMS
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
