name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_version: ${{ steps.tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bump tag version
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: major

  build:
    name: Build ${{ matrix.target }}
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main

      - name: Build release binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            nix develop .#release --command cargo zigbuild \
              --release \
              --locked \
              --target "${{ matrix.target }}"
          else
            nix develop .#release --command cargo build --release --locked
          fi

      - name: Package release binary
        shell: bash
        run: |
          set -euo pipefail
          asset="static-nix-cache-${{ matrix.target }}"
          mkdir -p dist
          if [ "$RUNNER_OS" = "Linux" ]; then
            binary="target/${{ matrix.target }}/release/static-nix-cache"
          else
            binary="target/release/static-nix-cache"
          fi
          cp "$binary" "dist/${asset}"
          chmod +x "dist/${asset}"
          "dist/${asset}" --version

          if [ "$RUNNER_OS" = "Linux" ] && ! file "dist/${asset}" | grep -q 'statically linked'; then
            echo "Linux release binary is not statically linked" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: static-nix-cache-${{ matrix.target }}
          path: dist/static-nix-cache-${{ matrix.target }}
          if-no-files-found: error

  publish:
    needs: [setup, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: static-nix-cache-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum static-nix-cache-* > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.setup.outputs.release_version }}
          name: static-nix-cache ${{ needs.setup.outputs.release_version }}
          generate_release_notes: true
          files: |
            dist/static-nix-cache-*
            dist/SHA256SUMS
          overwrite_files: true
          fail_on_unmatched_files: true
