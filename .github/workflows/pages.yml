name: Deploy Cache

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_OWNER: ${{ github.repository_owner }}
      GITHUB_REPO: ${{ github.event.repository.name }}
      GITHUB_RELEASE_TAG: nix-cache
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main

      - name: Build static-nix-cache
        run: nix build .#default --print-out-paths --accept-flake-config | tee "$RUNNER_TEMP/store-paths.txt"

      - name: Build compressed local cache
        run: |
          set -euo pipefail
          cache_dir="$RUNNER_TEMP/publish-cache"
          mkdir -p "$cache_dir"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            nix copy \
              --to "file://${cache_dir}?compression=zstd" \
              "$path"
          done < "$RUNNER_TEMP/store-paths.txt"

      - name: Publish cache
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./result/bin/static-nix-cache publish \
            --cache-dir "$RUNNER_TEMP/publish-cache" \
            --output-dir "$RUNNER_TEMP/nix-cache-static"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/nix-cache-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
