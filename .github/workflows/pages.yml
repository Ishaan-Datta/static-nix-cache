name: Build and publish Nix cache

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: nix-cache
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package and dev shell
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.cache.outputs.page-url }}
    outputs:
      cache-url: ${{ steps.cache.outputs.page-url }}
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main

      - name: Build package and development shell
        id: build
        run: |
          set -euo pipefail
          system=$(nix eval --impure --raw --expr builtins.currentSystem)
          package=$(nix build .#default --no-link --print-build-logs --print-out-paths)
          dev_shell=$(nix build ".#devShells.${system}.default" \
            --no-link \
            --print-build-logs \
            --print-out-paths)
          {
            echo "binary=$package/bin/static-nix-cache"
            echo 'paths<<EOF'
            printf '%s\n%s\n' "$package" "$dev_shell"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Publish and deploy cache
        id: cache
        uses: ./deploy
        with:
          binary: ${{ steps.build.outputs.binary }}
          paths: ${{ steps.build.outputs.paths }}
          signing-key: ${{ secrets.NIX_CACHE_SIGNING_KEY }}

  dogfood:
    name: Substitute package and dev shell
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main

      - name: Build exclusively from the published cache
        env:
          CACHE_URL: ${{ needs.publish.outputs.cache-url }}
          CACHE_PUBLIC_KEY: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          CACHE_URL=${CACHE_URL%/}
          curl --fail --location --silent --show-error \
            --retry 10 \
            --retry-all-errors \
            "$CACHE_URL/nix-cache-info" >/dev/null

          system=$(nix eval --impure --raw --expr builtins.currentSystem)
          options=(
            --option substituters "$CACHE_URL"
            --option max-jobs 0
          )

          if [ -n "$CACHE_PUBLIC_KEY" ]; then
            options+=(--option trusted-public-keys "$CACHE_PUBLIC_KEY")
          else
            echo "::warning::NIX_CACHE_PUBLIC_KEY is not configured; checking cache transport without signatures"
            options+=(--option require-sigs false)
          fi

          nix build \
            .#default \
            ".#devShells.${system}.default" \
            --no-link \
            --print-build-logs \
            "${options[@]}"

      - name: Run the substituted development shell
        run: nix develop --command static-nix-cache --version
