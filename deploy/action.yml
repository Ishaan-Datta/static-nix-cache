name: "static-nix-cache Deploy"
description: "Publish newly built Nix store paths to GitHub Releases"

inputs:
  signing-key:
    description: "Nix signing key (keyname:base64-ed25519-private)"
    required: false
  compression:
    description: "Compression type for nix copy (none, xz, zstd)"
    required: false
    default: "zstd"

outputs:
  static-path:
    description: "Directory containing the static binary cache metadata"
    value: ${{ steps.publish.outputs.static-path }}

runs:
  using: composite
  steps:
    - name: Try restoring saved caches
      id: try-restore
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        pattern: static-nix-cache-*
        path: ${{ runner.temp }}/static-nix-cache-restore

    - name: Aggregate restored caches
      id: aggregate
      if: steps.try-restore.outcome == 'success'
      shell: bash
      run: |
        set -euo pipefail
        restore_dir="$RUNNER_TEMP/static-nix-cache-restore"
        aggregate_dir="$RUNNER_TEMP/static-nix-cache-aggregate"

        if [ ! -d "$restore_dir" ] || [ -z "$(ls -A "$restore_dir" 2>/dev/null)" ]; then
          echo "found=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        mkdir -p "$aggregate_dir/nix-cache"
        : > "$aggregate_dir/store-paths.txt"

        for dir in "$restore_dir"/*/; do
          [ -d "$dir" ] || continue
          if [ -f "$dir/store-paths.txt" ]; then
            cat "$dir/store-paths.txt" >> "$aggregate_dir/store-paths.txt"
          fi
          if [ -d "$dir/nix-cache" ]; then
            cp -Rn "$dir/nix-cache/." "$aggregate_dir/nix-cache/" 2>/dev/null || true
          fi
        done

        sort -u -o "$aggregate_dir/store-paths.txt" "$aggregate_dir/store-paths.txt"
        if [ -s "$aggregate_dir/store-paths.txt" ]; then
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "paths-file=$aggregate_dir/store-paths.txt" >> "$GITHUB_OUTPUT"
          echo "export-dir=$aggregate_dir/nix-cache" >> "$GITHUB_OUTPUT"
        else
          echo "found=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Resolve store paths
      id: prepare
      shell: bash
      env:
        RESTORED_FOUND: ${{ steps.aggregate.outputs.found }}
        RESTORED_PATHS_FILE: ${{ steps.aggregate.outputs.paths-file }}
      run: |
        set -euo pipefail
        paths_file="$RUNNER_TEMP/static-nix-cache-deploy-paths.txt"
        snapshot_path="/tmp/static-nix-cache-setup/store-paths-before.txt"
        store_dir="/nix/store"

        if [ "$RESTORED_FOUND" = "true" ] && [ -f "$RESTORED_PATHS_FILE" ]; then
          cp "$RESTORED_PATHS_FILE" "$paths_file"
        elif [ -f "$snapshot_path" ]; then
          current_paths=$(mktemp "$RUNNER_TEMP/static-nix-cache-paths.XXXXXX")
          find "$store_dir" -maxdepth 1 -mindepth 1 \
            -not -name '.links' \
            -not -name '*.drv' \
            -not -name '*.chroot' \
            | sort > "$current_paths"
          comm -23 "$current_paths" "$snapshot_path" > "$paths_file"
          rm -f "$current_paths"
        else
          mnc_addr="127.0.0.1:37515"
          if curl --fail --silent --request POST \
            "http://${mnc_addr}/api/workflow-finish" >/dev/null; then
            mnc_pid_file="${MAGIC_NIX_CACHE_DAEMONDIR:-}/daemon.pid"
            if [ -f "$mnc_pid_file" ]; then
              find "$store_dir" -maxdepth 1 -mindepth 1 \
                -not -name '.links' \
                -not -name '*.drv' \
                -not -name '*.chroot' \
                -cnewer "$mnc_pid_file" \
                | sort > "$paths_file"
            else
              echo "::error::magic-nix-cache is running but MAGIC_NIX_CACHE_DAEMONDIR is not set"
              exit 1
            fi
          else
            echo "::error::Could not detect store paths. Run the setup action before building, use save in build jobs, or run magic-nix-cache."
            exit 1
          fi
        fi

        count=$(wc -l < "$paths_file")
        echo "Will deploy $count store path(s)"
        echo "paths-file=$paths_file" >> "$GITHUB_OUTPUT"

    - name: Install static-nix-cache
      id: install
      shell: bash
      env:
        STATIC_NIX_CACHE_REPOSITORY: Ishaan-Datta/static-nix-cache
        STATIC_NIX_CACHE_VERSION: v0.1.0
      run: |
        set -euo pipefail
        case "${RUNNER_OS}:${RUNNER_ARCH}" in
          Linux:X64) target="x86_64-unknown-linux-musl" ;;
          Linux:ARM64) target="aarch64-unknown-linux-musl" ;;
          macOS:X64) target="x86_64-apple-darwin" ;;
          macOS:ARM64) target="aarch64-apple-darwin" ;;
          *)
            echo "::error::Unsupported runner platform: ${RUNNER_OS}/${RUNNER_ARCH}"
            exit 1
            ;;
        esac

        asset="static-nix-cache-${target}"
        base_url="https://github.com/${STATIC_NIX_CACHE_REPOSITORY}/releases/download/${STATIC_NIX_CACHE_VERSION}"
        install_dir=$(mktemp -d "$RUNNER_TEMP/static-nix-cache.XXXXXX")
        binary="$install_dir/static-nix-cache"

        curl --fail --location --silent --show-error --retry 3 \
          --proto '=https' --tlsv1.2 \
          "$base_url/$asset" \
          --output "$binary"
        curl --fail --location --silent --show-error --retry 3 \
          --proto '=https' --tlsv1.2 \
          "$base_url/SHA256SUMS" \
          --output "$install_dir/SHA256SUMS"

        expected=""
        while read -r checksum filename; do
          if [ "$filename" = "$asset" ]; then
            expected="$checksum"
            break
          fi
        done < "$install_dir/SHA256SUMS"

        if [ -z "$expected" ]; then
          echo "::error::No checksum published for $asset"
          exit 1
        fi

        if [ "$RUNNER_OS" = "macOS" ]; then
          actual=$(shasum -a 256 "$binary" | cut -d ' ' -f 1)
        else
          actual=$(sha256sum "$binary" | cut -d ' ' -f 1)
        fi
        if [ "$actual" != "$expected" ]; then
          echo "::error::Checksum mismatch for $asset"
          exit 1
        fi

        chmod +x "$binary"
        "$binary" --version
        echo "binary=$binary" >> "$GITHUB_OUTPUT"

    - name: Build local binary cache
      id: cache
      shell: bash
      env:
        COMPRESSION: ${{ inputs.compression }}
        EXPORT_DIR: ${{ steps.aggregate.outputs.export-dir }}
        PATHS_FILE: ${{ steps.prepare.outputs.paths-file }}
        SIGNING_KEY: ${{ inputs.signing-key }}
      run: |
        set -euo pipefail
        case "$COMPRESSION" in
          none|xz|zstd) ;;
          *)
            echo "::error::Unsupported compression '$COMPRESSION'; expected none, xz, or zstd"
            exit 1
            ;;
        esac

        publish_cache=$(mktemp -d "$RUNNER_TEMP/static-nix-cache-publish.XXXXXX")
        while IFS= read -r path; do
          [ -z "$path" ] && continue
          if [ -n "$EXPORT_DIR" ] && [ -d "$EXPORT_DIR" ]; then
            nix copy \
              --from "file://$EXPORT_DIR" \
              --to "file://${publish_cache}?compression=${COMPRESSION}" \
              --no-check-sigs \
              "$path"
          else
            nix copy \
              --to "file://${publish_cache}?compression=${COMPRESSION}" \
              --no-check-sigs \
              "$path"
          fi
        done < "$PATHS_FILE"

        if [ -n "$SIGNING_KEY" ]; then
          key_file=$(mktemp "$RUNNER_TEMP/static-nix-cache-key.XXXXXX")
          chmod 600 "$key_file"
          printf '%s\n' "$SIGNING_KEY" > "$key_file"
          trap 'rm -f "$key_file"' EXIT

          while IFS= read -r path; do
            [ -z "$path" ] && continue
            nix store sign \
              --store "file://${publish_cache}" \
              --key-file "$key_file" \
              --recursive \
              "$path"
          done < "$PATHS_FILE"
        fi

        echo "directory=$publish_cache" >> "$GITHUB_OUTPUT"

    - name: Publish local binary cache
      id: publish
      shell: bash
      env:
        BINARY: ${{ steps.install.outputs.binary }}
        CACHE_DIR: ${{ steps.cache.outputs.directory }}
        GITHUB_OWNER: ${{ github.repository_owner }}
        GITHUB_REPO: ${{ github.event.repository.name }}
        GITHUB_RELEASE_TAG: nix-cache
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        static_path="$RUNNER_TEMP/static-nix-cache-static"
        "$BINARY" publish \
          --cache-dir "$CACHE_DIR" \
          --output-dir "$static_path"
        echo "static-path=$static_path" >> "$GITHUB_OUTPUT"
